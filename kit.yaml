name: epic
version: 0.1.0
description: >-
  Leads a feature (an epic) from a free-form statement to a delivered result: checks the
  statement is ready and asks you what is missing, plans small verifiable steps, runs
  each step as a run of the flow `task` of the kit `sdlc` in the same session, reviews
  every step's results and revises the plan, and ends with a release-readiness check and
  a report of every decision. You approve the plan, each next step and the delivery, and
  keep every gate of `sdlc`. Writes no product code. Start it with the kit `sdlc` and a
  tracker kit.
supervisor: supervisor
expects:
  skills: [tracker, sdlc-settings]
  commands: [git]
dependencies:
  lado: ">=0.34"
