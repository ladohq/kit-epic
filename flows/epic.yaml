name: epic
description: >-
  One epic from its statement to delivery: the lead checks the statement against the
  readiness checklist and asks the human what is missing, writes a plan of small
  verifiable steps with the first step's brief, a fresh critic reviews them, the human
  approves; then, step by step, the lead creates the step's tracker task, runs it as a
  run of the flow `task` of `sdlc`, reviews its results, revises the plan and drafts the
  next step, which starts at once when the plan is unchanged and on the human's yes
  otherwise; when no step is left, a delivery worker checks release
  readiness and writes the final report, and on the human's yes the lead closes the epic.
  The run's task is the human's statement of the feature, from one line to a full
  specification.
start: intake
states:
  intake:
    agent: supervisor
    produces: [epic-brief]
    do: |
      Take the run's task, the human's statement of the feature, and make it ready to plan.
      1. Read the statement, the code and docs it touches, and `docs/epics/` of
         `origin/<base>` after `git fetch origin`: an epic of the same feature may exist already. Then ask the human
         whether this run continues it. When an open `epic` run holds it, recommend
         cancelling this run. When it continues, keep its key and extend its files:
         every row of `decisions.md` stays, `brief.md` gains the new statement with the
         old one kept, and `plan.md` keeps its done steps and their numbers, its State
         back to `plan`.
      2. Settle the epic's key with the human first (`epic-files`, "The key"): it names the
         folder that keeps their answers.
      3. Assess it against the readiness checklist of `epic-files` (`brief.md`).
      4. Ask the human what is missing, in rounds: one message per round, numbered
         questions, each with what you found and your recommended answer. Ask what only
         the human can know; look the rest up yourself. After each round add its
         decisions to `docs/epics/<key>/decisions.md` (`epic-files`) and commit in the
         run's worktree, so a lost context loses no answer.
      5. Settle with them the branch strategy: by default every step merges into the base branch and leaves the
         product working, unfinished parts hidden; or an epic branch, named by the
         settings' pattern (`sdlc-settings`, **Git**), which the lead creates on the
         remote and, after every step, brings the base into and pushes, merged into the
         base by a final pull request. Ask which; recommend the default unless steps cannot each leave the
         product working.
      Write `docs/epics/<key>/brief.md` (when continuing, add to it), commit it in the run's
      worktree, then write `epic-brief` from it.
      Done when every checklist topic has a verdict, the human answered every round, and
      the files are committed. Report `ready`: note_summary is the key and the verdict
      ("ready to plan" or "research first: <what is unknown>"); note_body the decisions
      taken and the questions left open on purpose.
    outcomes: {ready: plan}
  plan:
    agent: supervisor
    reads: [epic-brief, plan-review]
    produces: [plan, step-brief]
    do: |
      Write `docs/epics/<key>/plan.md` (`epic-files`, "plan.md") from `epic-brief`; on a
      continued epic, extend it, keeping its done steps and their numbers:
      - small steps, each with its check, split and checked as `epic-files` says
        ("plan.md"); a walking skeleton (the thinnest end-to-end path, checked in CI) as
        early as it can be;
      - research first when the brief says data is missing: a step whose result is a
        research document with checks and difficulties; a small feature is one step;
      - mark steps that could run two at once and the files each touches;
      - the open questions with your recommendation, and "Later".
      Turn each "missing" topic of `brief.md` into its step or open question. Then draft
      the first step with `step-brief`. Commit `plan.md`, `brief.md` and `decisions.md` in
      the run's worktree, write `plan` and `epic-brief` from them; write `step-brief`
      whole.
      On a later visit the note says why you are back: the critic's `plan-review` (fix or
      answer each finding, by its ID) or the human's reason for rejecting at `plan_ok`
      (quote it at the top of `plan`'s State, record it in `decisions.md`). When that
      rejection follows the third review, the next review reaches its limit: tell the
      human, and recommend `continue` when the critic should see the revision.
      Revise the
      committed files, not a version from memory, and write both artifacts whole again.
      Done when every step has a check, the first step's draft is complete, and the files
      are committed. Report `ready`: note_summary is the number of steps and the first
      step's title; note_body what changed since the last visit.
    outcomes: {ready: plan_review}
  plan_review:
    agent: plan-critic
    max_visits: 3
    reads: [epic-brief, plan, step-brief]
    produces: [plan-review]
    do: |
      Review the brief, the plan and the first step's draft as your role describes, and
      write `plan-review` whole.
      On a later visit your previous review is your `plan-review` artifact: mark each of
      its findings RESOLVED or STILL OPEN first, then look for new ones.
      Done when every finding has an ID, a severity, its place and a quote. Report `ok`
      when no finding is blocking; `changes` otherwise. On the third visit report `ok`
      whatever is open, with each open blocking finding under "Questions for the human":
      the human decides it at `plan_ok`. note_summary is the verdict and the counts by
      severity; note_body the blocking findings by ID.
    outcomes: {ok: plan_ok, changes: plan}
  plan_ok:
    gate: approval
    reads: [epic-brief, plan, plan-review, step-brief]
    ask: >-
      Approve the plan, its open questions as recommended (or as you say), and the first
      step? This also lets the lead create the tracker tasks of the plan's later steps and
      start them without `step_ok` while a step's review does not change the plan; a
      change, or your "pause" to the lead, brings `step_ok`. The lead then merges the
      plan's pull request after green CI, creates the first step's tracker task and starts
      its run of `task`.
    outcomes: {approved: run, rejected: plan}
  run:
    agent: supervisor
    reads: [plan, step-brief]
    do: |
      Carry out the step(s) the human approved: after a gate, the note is their answer, and
      a comment binds like the plan; after `continue`, the next step of the plan.
      0. After a gate, record the answer in `decisions.md` (`epic-files`: a row or the
         step's counter line) and change `plan.md` where it changes it; commit. After
         `continue` there is no answer: record nothing.
      1. After `plan_ok`, merge the approved plan: push the run's branch, open its pull
         request to the base branch, wait for green CI and merge it; after `step_ok` or
         `continue`, only push the run's branch (`epic-files`, "Changing the files").
      2. On an epic branch, when it does not exist on the remote yet: create it from the
         base and push it.
      3. For each step to start, take its tracker key from `plan.md` when it has one (a
         resumed step, or one whose task a lost context left without a run); only for a
         step without a key, create its tracker task from `step-brief` with `tracker`
         (the human's yes at `plan_ok` or `step_ok` is the yes to create), linked to the
         epic's tracker task when the epic has one, check the write (`sdlc-settings`,
         "Writing to the tracker"), and at once mark the step "in progress (<KEY>)" in
         `plan.md` and commit, so a restart creates no second task. Start its run of `task`
         (`step-brief`, "Starting the step's run"). Add the run to the step's status,
         remove a pause from the State, and commit.
      4. While the runs go, lead them as your role says ("While a step runs", "Telling the
         human").
      A push, a red CI or a refused merge goes as `epic-files` says ("When a command
      fails"); this step has no outcome for it.
      Done when every run of `task` you started here has ended (done, dropped or
      cancelled). Report `done`: note_summary is each step with its key and how its run
      ended; note_body the pull requests, what the human said at the gates, and anything
      the review must look at first.
    outcomes: {done: review}
  review:
    agent: supervisor
    reads: [plan, step-brief, delivery-report]
    produces: [retro]
    do: |
      Review the step(s) that just ended and revise the plan, with `step-review`: read
      every fixed source, apply the revision techniques, run the routines it names when
      they apply (a release since the last review, an epic branch).
      Write `retro` whole: per source what it gave, the plan changes with their technique
      and reason, the decisions recorded, the open checks and their events. Update
      `plan.md` (State, the step's status, leftovers, "Later") and `decisions.md`, commit
      them, and write `plan` from `plan.md` again; push nothing yet (`run` does).
      When a step is left, draft it (two only as `step-brief` says, "Two steps at once")
      with `step-brief` and write `step-brief` whole. When the epic is paused (`step-brief`,
      the step back to "planned"), write `retro` and the State with the pause, and write
      `step-brief` whole: the line "No step proposed: the epic is paused (<why>); approving
      resumes S<n> with its tracker task <KEY>", then S<n>'s task draft and brief in full,
      which its resumed run starts with; report `next`, the note saying `step_ok`
      waits for `sdlc`, or the human cancels the run. When you come back from `readiness` with
      `gaps`, its `delivery-report` names what is missing: each gap becomes a step or goes
      to "Later" on the human's word.
      Done when every source is read or marked unavailable with the reason, and the files
      are committed. Report `continue` when nothing changed the plan (`step-review`, "What
      changes the plan") and the next step is one the human approved at `plan_ok` or an
      earlier `step_ok`: note_summary is the step reviewed and the next one; note_body each
      kind of change with "no". Report `next` otherwise, always after the human's "pause",
      with the revision and the next step's draft for the human's yes: note_summary is the
      step reviewed and the next one; note_body the plan changes and your recommendation.
      Report `finish` when the plan has no step left, or when the human asks for the
      readiness check with steps left, which then go to "Later" on their word;
      note_summary says which. A rejection at `step_ok` brings you
      back with the human's reason: record it in `decisions.md`, revise as they say and
      write `retro`, `plan` and `step-brief` again.
    outcomes: {continue: run, next: step_ok, finish: readiness}
  step_ok:
    gate: approval
    reads: [retro, plan, step-brief]
    ask: >-
      Approve the plan's revision and the next step? The lead then pushes the run's branch
      (the plan reaches the base at `close`), creates the step's tracker task (or reuses
      the paused step's) and starts its run of `task`.
    outcomes: {approved: run, rejected: review}
  readiness:
    agent: delivery
    max_visits: 3
    reads: [epic-brief, plan, retro]
    produces: [delivery-report]
    do: |
      Check whether the epic's result is ready to release, as your role describes, and
      write `docs/epics/<key>/report.md` (`epic-files`, "report.md").
      On a later visit after `gaps` (the steps the review added have ended) or `stale`,
      first mark each gap of your previous `delivery-report` RESOLVED or STILL OPEN; then
      check what changed on the base, and the epic branch, since the commit your last
      report checked, and the results of all steps again; run the upgrade and the
      rollbacks of the steps' checks again only when that change touches migrations, the
      update, the install or the user's files, else keep their earlier results with their
      commit. After `stale` the note gives the refused push, the conflict or the red CI:
      quote the command and its output at the top of the report. After a rejection at
      `delivery_ok` the note is the human's reason: quote it at the top of the report and
      answer it.
      On the third visit report `ready` whatever is open, each gap under "Questions for the
      human" in the report: the human decides it at `delivery_ok`.
      Done when every part of the report is filled from evidence (a command and its output,
      a source by name) or says why it cannot be, the report names the commits it checked,
      and it is committed in the run's
      worktree; then write `delivery-report` from it. Report `gaps` when the report holds a
      gap as your role defines it; `ready` otherwise: note_summary is the verdict;
      note_body each gap with its evidence. A failure outside the work is no outcome
      (`epic-files`, "When a command fails").
    outcomes: {ready: delivery_ok, gaps: review}
  delivery_ok:
    gate: approval
    reads: [delivery-report, plan]
    ask: >-
      Accept the epic as delivered? The lead merges the closing pull request; on an epic
      branch it first pushes the base merge the report describes (with its conflict
      resolutions) to the epic branch, then merges the epic branch into the base. It marks
      the plan closed and closes the epic's tracker task when it has one. Releasing the
      product stays yours.
    outcomes: {approved: close, rejected: readiness}
  close:
    agent: supervisor
    reads: [delivery-report]
    do: |
      Close the epic the human accepted; their comment at the gate binds.
      1. Record their answer in `decisions.md` and commit in the run's worktree.
      2. On an epic branch: push the readiness branch `delivery` left and delete it
         (`step-review`, "Epic branch", "At close"), open the pull request from the epic
         branch into the base (or reuse the one an earlier `close` opened), wait for green CI and merge it. This comes before step 3,
         so the base never says "closed" for a result that is not on it.
      3. Mark `plan.md` closed (State: "closed", the date, a link to `report.md`), commit
         with the report and merge it as a plan change.
      4. When the epic has a tracker task, post the report's summary on it and move it
         to the status that means done, with `tracker`.
      Any other failed push, red CI or refused merge goes as `epic-files` says ("When a
      command fails").
      Done when the pull requests are merged and the tracker shows the writes. Report
      `closed`: note_summary is the merged pull requests; note_body what is left for the
      human (the release, the open checks in the release checklist). Report `stale` when
      in step 2 the push of the readiness branch is refused because the epic branch moved,
      or the pull request from the epic branch into the base is red from the work or
      conflicts with the base: the readiness check is out of date and `delivery` checks
      again; note_body the command and its output. When `readiness` has had its three
      visits (`flow_status`), report `stale` anyway: LADO holds the run at its limit; show
      the human the command and its output and recommend `continue` when a fresh readiness
      check can rebuild the result, `cancel` otherwise; before `cancel`, push the run's
      branch and name the commits only it holds (`git log origin/<base>..<the run's
      branch>`): the plan's and decisions' changes since `plan_ok`.
    outcomes: {closed: done, stale: readiness}
  done:
    end: true
